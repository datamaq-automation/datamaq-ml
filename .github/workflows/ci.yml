# .github/workflows/ci.yml — Gauntlet local de datamaq-ml en un runner propio.
#
# Corre los mismos comandos que se usan en local (./run.sh), para que la validación
# de un PR hacia main sea la misma que la del desarrollador. Se ejecuta solo en un
# runner self-hosted con la etiqueta datamaq-ci; no usa runners hospedados por GitHub.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gauntlet:
    name: Gauntlet (test, gauntlet, audit, lint)
    runs-on: [self-hosted, linux, datamaq-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias de desarrollo
        run: ./run.sh install

      - name: Tests (pytest)
        run: ./run.sh test

      - name: Restricciones arquitectónicas (gauntlet)
        run: ./run.sh gauntlet

      - name: Auditoría de código muerto y componentes Dios
        run: ./run.sh audit

      - name: Lint y formato (ruff)
        run: ./run.sh lint
